name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.platform.label }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.platform.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        platform:
          - label: macos-latest
            runs-on: macos-latest
            python-arch: arm64
          - label: windows-x64
            runs-on: windows-latest
            python-arch: x64
          - label: windows-x86
            runs-on: windows-latest
            python-arch: x86
          - label: windows-arm64
            runs-on: windows-11-arm
            python-arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.platform.python-arch }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.platform.label }}

      - name: Install dependencies
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: uv sync --locked --extra dev

      - name: Lint with ruff
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: uv run ruff check .

      - name: Run tests
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: uv run --locked pytest

  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Verify matrix tests passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test matrix result: ${{ needs.test.result }}"
            exit 1
          fi

  build:
    name: Build distributions (${{ matrix.label }})
    runs-on: ${{ matrix.runs-on }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos
            runs-on: macos-latest
            python-arch: arm64
            artifact-name: dist-macos
            build-sdist: true
          - label: windows-x64
            runs-on: windows-latest
            python-arch: x64
            artifact-name: dist-windows-x64
            build-sdist: false
          - label: windows-x86
            runs-on: windows-latest
            python-arch: x86
            artifact-name: dist-windows-x86
            build-sdist: false
          - label: windows-arm64
            runs-on: windows-11-arm
            python-arch: arm64
            artifact-name: dist-windows-arm64
            build-sdist: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python-arch }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.label }}

      - name: Build sdist
        if: matrix.build-sdist
        run: uv build --sdist

      - name: Build wheel
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: uv build --wheel

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*
            LICENSE
